server.port=8081
logging.config=classpath:logback.xml

xxl.job.admin.addresses = http://127.0.0.1:8083/xxl-job-admin
xxl.job.executor.appname = xxl-job-executor
xxl.job.executor.port = 9999
xxl.job.executor.logpath = /usr/local/log/xxl-job
xxl.job.executor.logretentiondays = 30

## 线程方面对配置
exec.thread.coreSize=10
exec.thread.maxSize=20
exec.thread.keepAliveTime=10



